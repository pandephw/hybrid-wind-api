name: WindKite BMKG Surface Beta - Tahap 4
on:
  workflow_dispatch:
  schedule:
    # Check at intervals. Source issuance may be delayed; GitHub cron is not exact.
    - cron: '33 0,6,12,18 * * *'
permissions:
  contents: read
concurrency:
  group: windkite-bmkg-surface-beta-artifact
  cancel-in-progress: false
jobs:
  build-beta-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Stage 3 functions
        run: python scripts/test_bmkg_surface_preview.py
      - name: Obtain new BMKG land and marine forecasts, QC and marine polygon
        id: upstream
        continue-on-error: true  # no valid common time writes a QC report, then exits 1
        run: python scripts/build_bmkg_surface_preview.py
      - name: Interpret QC and write actionable availability report
        id: readiness
        run: python scripts/check_bmkg_surface_readiness.py
      - name: Detect unexpected upstream build failure
        if: steps.readiness.outputs.ready == 'true' && steps.upstream.outcome != 'success'
        run: |
          echo 'QC says READY but Stage 3 exited unexpectedly; check logs before accepting output.' >&2
          exit 1
      - name: Create standalone dashboard and JSON vector API
        if: steps.readiness.outputs.ready == 'true' && steps.upstream.outcome == 'success'
        run: >-
          python scripts/build_bmkg_surface_beta.py
          --input bmkg_surface_preview_tahap3/bmkg_surface_preview.json
          --output bmkg_surface_beta_tahap4
          --template scripts/bmkg_surface_beta_template.html
      - name: Verify beta product
        if: steps.readiness.outputs.ready == 'true' && steps.upstream.outcome == 'success'
        run: python scripts/test_bmkg_surface_beta.py bmkg_surface_beta_tahap4
      - name: Upload NEW product beta artifact, only when source data valid
        if: steps.readiness.outputs.ready == 'true' && steps.upstream.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: WindKite-BMKG-Surface-Beta-Tahap4
          path: bmkg_surface_beta_tahap4/
          retention-days: 14
          if-no-files-found: error
      - name: Upload QC and source freshness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindKite-BMKG-Surface-QC-Diagnostics
          path: |
            bmkg_surface_preview_tahap3/bmkg_surface_preview.json
            bmkg_surface_preview_tahap3/RINGKASAN_TAHAP3.md
            bmkg_surface_preview_tahap3/availability.json
          retention-days: 14
          if-no-files-found: warn
